<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-label="Blipdeck: record sounds, trim them, play them with a key">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1e2b"/>
      <stop offset="1" stop-color="#101219"/>
    </linearGradient>
    <radialGradient id="glow-blue" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#6c8cff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#6c8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-orange" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff7a59" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ff7a59" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f45"/>
      <stop offset="1" stop-color="#15171f"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6c8cff" stop-opacity="0"/>
      <stop offset=".25" stop-color="#6c8cff"/>
      <stop offset=".5" stop-color="#2ec4a6"/>
      <stop offset=".75" stop-color="#f5b942"/>
      <stop offset="1" stop-color="#ff7a59" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="400"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">

  <rect width="1280" height="400" fill="url(#bg)"/>
  <circle cx="230" cy="170" r="260" fill="url(#glow-blue)"/>
  <circle cx="1080" cy="260" r="280" fill="url(#glow-orange)"/>

  <!-- waveform running along the bottom -->
  <path d="M0 330 H330 l10 -18 12 40 14 -64 14 76 12 -46 10 12 H640 l8 -10 10 26 12 -38 10 30 8 -8 H930 l10 -22 12 48 12 -30 10 4 H1280"
        fill="none" stroke="url(#wave)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>

  <!-- logo -->
  <g transform="translate(96 74) scale(1.4)">
    <rect width="128" height="128" rx="30" fill="url(#tile)"/>
    <rect x="1.5" y="1.5" width="125" height="125" rx="28.5" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="3"/>
    <rect x="20" y="20" width="41" height="41" rx="11" fill="#6c8cff"/>
    <rect x="67" y="20" width="41" height="41" rx="11" fill="#ff7a59"/>
    <rect x="20" y="67" width="41" height="41" rx="11" fill="#2ec4a6"/>
    <rect x="67" y="67" width="41" height="41" rx="11" fill="#f5b942"/>
    <rect x="20" y="20" width="88" height="88" rx="11" fill="url(#shine)" opacity=".6"/>
    <path d="M26 41.5h8.5l3.5-7 5 15 4.5-17 3.5 9h4" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <text x="320" y="190" fill="#e8eaf0" font-family="Inter, 'SF Pro Display', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-3">Blipdeck</text>
  <text x="324" y="248" fill="#8a90a2" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="500">Record sounds. Trim them. Play them with a key.</text>

  <!-- pads with shortcut keys -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#fff">
    <g transform="translate(990 100)">
      <rect width="104" height="84" rx="16" fill="#6c8cff"/>
      <rect x="10" y="10" width="30" height="26" rx="7" fill="#000" fill-opacity=".3"/>
      <text x="25" y="30" text-anchor="middle">1</text>
    </g>
    <g transform="translate(1110 100)">
      <rect width="104" height="84" rx="16" fill="#ff7a59"/>
      <rect x="10" y="10" width="30" height="26" rx="7" fill="#000" fill-opacity=".3"/>
      <text x="25" y="30" text-anchor="middle">2</text>
    </g>
    <g transform="translate(990 196)">
      <rect width="104" height="84" rx="16" fill="#2ec4a6"/>
      <rect x="10" y="10" width="30" height="26" rx="7" fill="#000" fill-opacity=".3"/>
      <text x="25" y="30" text-anchor="middle">3</text>
    </g>
    <g transform="translate(1110 196)">
      <rect width="104" height="84" rx="16" fill="#f5b942"/>
      <rect x="10" y="10" width="30" height="26" rx="7" fill="#000" fill-opacity=".3"/>
      <text x="25" y="30" text-anchor="middle">4</text>
      <!-- this one is "playing" -->
      <rect x="12" y="74" width="60" height="5" rx="2.5" fill="#fff" fill-opacity=".85"/>
    </g>
  </g>
  </g>
</svg>
