<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blipdeck</title>
  <meta name="description" content="Record sounds, trim them and play them with buttons or keyboard shortcuts. Runs entirely in your browser.">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Icon set: used as <svg class="icon"><use href="#i-name"/></svg> -->
  <svg xmlns="http://www.w3.org/2000/svg" class="sprite" aria-hidden="true">
    <defs>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" class="solid"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z" class="solid"/></symbol>
      <symbol id="i-volume" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z" class="solid"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2" class="solid"/><circle cx="12" cy="12" r="2" class="solid"/><circle cx="19" cy="12" r="2" class="solid"/></symbol>
      <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></symbol>
      <symbol id="i-scissors" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/></symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></symbol>
      <symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></symbol>
      <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M4 20 14 10M15 3l1.2 2.8L19 7l-2.8 1.2L15 11l-1.2-2.8L11 7l2.8-1.2zM19.5 13l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6z"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 7h14l-3-3M20 17H6l3 3"/></symbol>
      <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8M3 3v5h5"/></symbol>
      <symbol id="i-github" viewBox="0 0 24 24"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></symbol>
    </defs>
  </svg>

  <header>
    <h1 class="brand"><img src="logo.svg" alt="" width="34" height="34">Blipdeck</h1>
    <div class="toolbar">
      <button id="recordBtn" class="record" data-i18n-title="recordTitle">
        <span class="dot"></span><span id="recordLabel" data-i18n="record">Record</span>
      </button>
      <span id="timer" class="timer" hidden>0:00</span>
      <label class="button secondary" data-i18n-title="importTitle">
        <svg class="icon"><use href="#i-upload"/></svg><span data-i18n="import">Import</span>
        <input id="importInput" type="file" accept="audio/*,.json,application/json" multiple hidden>
      </label>
      <button id="exportBtn" class="secondary" data-i18n-title="exportTitle">
        <svg class="icon"><use href="#i-download"/></svg><span data-i18n="export">Export</span>
      </button>
      <button id="stopAllBtn" class="secondary" data-i18n-title="stopAllTitle">
        <svg class="icon"><use href="#i-stop"/></svg><span data-i18n="stopAll">Stop all</span>
      </button>
      <!-- Only on the online demo: a local install holds the user's own sounds. -->
      <button id="resetDemoBtn" class="secondary" data-i18n-title="resetDemoTitle" hidden>
        <svg class="icon"><use href="#i-reset"/></svg><span data-i18n="resetDemo">Reset demo</span>
      </button>
      <label class="volume" data-i18n-title="volumeTitle">
        <svg class="icon"><use href="#i-volume"/></svg>
        <input id="masterVolume" type="range" min="0" max="1" step="0.01" value="1">
      </label>
      <div class="lang-picker">
        <button id="languageButton" class="secondary" aria-haspopup="listbox" aria-expanded="false" data-i18n-title="languageTitle">
          <img class="flag" alt=""><span class="lang-name"></span><svg class="icon chevron"><use href="#i-chevron"/></svg>
        </button>
        <ul id="languageList" class="menu" role="listbox" hidden></ul>
      </div>
    </div>
  </header>

  <main>
    <p id="emptyState" class="empty" data-i18n-html="emptyState"></p>
    <div id="grid" class="grid"></div>
  </main>

  <footer>
    <span data-i18n-html="footer"></span>
    <a class="repo-link" href="https://github.com/azammarchi/blipdeck" target="_blank" rel="noopener">
      <svg class="icon"><use href="#i-github"/></svg>GitHub
    </a>
  </footer>

  <template id="padTemplate">
    <div class="pad">
      <button class="play" data-i18n-title="playTitle">
        <span class="badges">
          <span class="key"></span>
          <svg class="icon loop-badge"><use href="#i-repeat"/></svg>
        </span>
        <span class="name"></span>
        <span class="duration"></span>
        <span class="assign-hint" data-i18n="pressKey"></span>
        <span class="progress"></span>
      </button>
      <button class="more" aria-haspopup="menu" data-i18n-title="menuTitle">
        <svg class="icon"><use href="#i-more"/></svg>
      </button>
    </div>
  </template>

  <!-- One actions menu shared by every pad, opened by its ⋯ button. -->
  <div id="padMenu" class="menu" role="menu" hidden>
    <button role="menuitem" data-action="assign"><svg class="icon"><use href="#i-keyboard"/></svg><span data-i18n="assignTitle"></span></button>
    <button role="menuitem" data-action="trim"><svg class="icon"><use href="#i-scissors"/></svg><span data-i18n="trimTitle"></span></button>
    <button role="menuitem" data-action="rename"><svg class="icon"><use href="#i-pencil"/></svg><span data-i18n="renameTitle"></span></button>
    <button role="menuitemcheckbox" data-action="loop"><svg class="icon"><use href="#i-repeat"/></svg><span data-i18n="loopTitle"></span><svg class="icon check"><use href="#i-check"/></svg></button>
    <hr>
    <button role="menuitem" data-action="delete" class="danger"><svg class="icon"><use href="#i-trash"/></svg><span data-i18n="deleteTitle"></span></button>
  </div>

  <dialog id="trimDialog" class="modal trim-dialog">
    <form method="dialog">
      <h2 id="trimHeading"></h2>
      <p class="hint" data-i18n="trimHint"></p>
      <!-- Time always runs left to right, even in right-to-left languages. -->
      <div class="wave-wrap" dir="ltr">
        <canvas id="trimCanvas" width="1200" height="240"></canvas>
        <div id="trimShadeStart" class="shade"></div>
        <div id="trimShadeEnd" class="shade"></div>
        <div id="trimHandleStart" class="handle"></div>
        <div id="trimHandleEnd" class="handle"></div>
        <div id="trimPlayhead" class="playhead" hidden></div>
      </div>
      <div class="trim-times" dir="ltr">
        <span><span data-i18n="trimStart"></span> <strong id="trimStartLabel">0.00s</strong></span>
        <span><span data-i18n="trimLength"></span> <strong id="trimLengthLabel">0.00s</strong></span>
        <span><span data-i18n="trimEnd"></span> <strong id="trimEndLabel">0.00s</strong></span>
      </div>
      <div class="dialog-buttons">
        <button type="button" id="trimPreviewBtn" class="secondary">
          <svg class="icon"><use href="#i-play"/></svg><span data-i18n="preview"></span>
        </button>
        <button type="button" id="trimAutoBtn" class="secondary" data-i18n-title="removeSilenceTitle">
          <svg class="icon"><use href="#i-sparkles"/></svg><span data-i18n="removeSilence"></span>
        </button>
        <span class="spacer"></span>
        <button value="cancel" class="secondary"><svg class="icon"><use href="#i-x"/></svg><span data-i18n="cancel"></span></button>
        <button type="button" id="trimSaveBtn"><svg class="icon"><use href="#i-check"/></svg><span data-i18n="save"></span></button>
      </div>
    </form>
  </dialog>

  <dialog id="importDialog" class="modal import-dialog">
    <form method="dialog">
      <h2 id="importHeading"></h2>
      <p data-i18n="importQuestion"></p>
      <div class="dialog-buttons">
        <button value="cancel" class="secondary"><svg class="icon"><use href="#i-x"/></svg><span data-i18n="cancel"></span></button>
        <span class="spacer"></span>
        <button value="add" class="secondary"><svg class="icon"><use href="#i-plus"/></svg><span data-i18n="importAdd"></span></button>
        <button value="replace"><svg class="icon"><use href="#i-swap"/></svg><span data-i18n="importReplace"></span></button>
      </div>
    </form>
  </dialog>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
