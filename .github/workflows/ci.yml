# Runs the end-to-end tests on every push and pull request. The online demo
# is published by pages.yml, when a release is published.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (WebKit, Firefox, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # The browsers are cached between runs, keyed by the Playwright version in
      # the lock file; the system libraries they need are installed every time.
      - id: image
        shell: bash
        run: echo "name=$ImageOS" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # The system image (ubuntu24, macos15...) is part of the key: browsers
          # built for one image don't start on the next one.
          key: playwright-${{ runner.os }}-${{ steps.image.outputs.name }}-${{ hashFiles('package-lock.json') }}
      - name: Install browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps webkit firefox chromium
        timeout-minutes: 5
      - name: Install browser system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps webkit firefox chromium
        timeout-minutes: 5
      # GitHub's Linux machines have no sound card. Chromium and WebKit fall back
      # to a silent output by themselves; Firefox needs an audio server, or its
      # audio clock never moves.
      - name: Start a virtual sound card
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=virtual
          pactl set-default-sink virtual
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
